<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" width="2400" height="800">
  <title>MR Cam Kaplama Tasarımı - Ofis Cam Bölmeleri</title>

  <defs>
    <!-- Çapraz çizgi deseni -->
    <pattern id="diagonalStripes" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(-45)">
      <rect width="10" height="20" fill="#1e3a6e"/>
      <rect x="10" width="10" height="20" fill="transparent"/>
    </pattern>
  </defs>

  <!-- Arka plan (şeffaf cam için) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Sol taraf çapraz çizgiler -->
  <rect x="0" y="100" width="950" height="600" fill="url(#diagonalStripes)" opacity="0.95"/>

  <!-- Sağ taraf çapraz çizgiler -->
  <rect x="1450" y="100" width="950" height="600" fill="url(#diagonalStripes)" opacity="0.95"/>

  <!-- Merkez logo alanı - beyaz daire arka plan -->
  <circle cx="1200" cy="400" r="220" fill="white" opacity="0.98"/>
  <circle cx="1200" cy="400" r="225" fill="none" stroke="#1e3a6e" stroke-width="5"/>

  <!-- MR Logo - İyonik Sütun -->
  <g transform="translate(1200, 400)" fill="#1e3a6e">

    <!-- Üst başlık (abakus) -->
    <rect x="-85" y="-155" width="170" height="12" rx="2"/>

    <!-- Üst kısım altı -->
    <rect x="-75" y="-143" width="150" height="8"/>

    <!-- Sol volüt (kıvrım) -->
    <g transform="translate(-65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-4" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Sağ volüt (kıvrım) -->
    <g transform="translate(65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-16" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Volütler arası bağlantı -->
    <rect x="-50" y="-130" width="100" height="15" rx="3"/>

    <!-- Echinus (volüt altı yastık) -->
    <ellipse cx="0" cy="-100" rx="55" ry="8"/>

    <!-- Sütun gövdesi - dikey yivler -->
    <rect x="-50" y="-92" width="100" height="200" fill="#1e3a6e"/>

    <!-- Yiv çizgileri (fluting) - beyaz çizgiler -->
    <rect x="-40" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-25" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-10" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="6" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="21" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="36" y="-92" width="4" height="200" fill="white" opacity="0.3"/>

    <!-- Alt kaide -->
    <rect x="-55" y="108" width="110" height="10"/>
    <rect x="-60" y="118" width="120" height="8"/>

    <!-- Alt sivri uçlar -->
    <polygon points="-50,126 -35,126 -42,160"/>
    <polygon points="-20,126 -5,126 -12,155"/>
    <polygon points="5,126 20,126 12,155"/>
    <polygon points="35,126 50,126 42,160"/>

  </g>

  <!-- Üst ve alt çizgi vurgusu -->
  <rect x="100" y="95" width="2200" height="5" fill="#1e3a6e" opacity="0.8"/>
  <rect x="100" y="700" width="2200" height="5" fill="#1e3a6e" opacity="0.8"/>

</svg>