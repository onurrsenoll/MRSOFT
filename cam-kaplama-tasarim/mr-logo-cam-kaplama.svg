<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" width="2400" height="800">
  <title>MR Cam Kaplama Tasarımı - Ofis Cam Bölmeleri</title>

  <defs>
    <!-- Çapraz çizgi deseni -->
    <pattern id="diagonalStripes" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(-45)">
      <rect width="10" height="20" fill="#1e3a6e"/>
      <rect x="10" width="10" height="20" fill="transparent"/>
    </pattern>

    <!-- Logo için maske -->
    <mask id="logoMask">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="1200" cy="400" r="220" fill="black"/>
    </mask>

    <!-- Gradient efekti -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a6e;stop-opacity:0.3"/>
      <stop offset="30%" style="stop-color:#1e3a6e;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#1e3a6e;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#1e3a6e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1e3a6e;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Arka plan (şeffaf cam için) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Sol taraf çapraz çizgiler -->
  <rect x="0" y="100" width="980" height="600" fill="url(#diagonalStripes)" opacity="0.95"/>

  <!-- Sağ taraf çapraz çizgiler -->
  <rect x="1420" y="100" width="980" height="600" fill="url(#diagonalStripes)" opacity="0.95"/>

  <!-- Merkez logo alanı - beyaz daire arka plan -->
  <circle cx="1200" cy="400" r="200" fill="white" opacity="0.95"/>
  <circle cx="1200" cy="400" r="205" fill="none" stroke="#1e3a6e" stroke-width="4"/>

  <!-- MR Logo - Sütun tasarımı -->
  <g transform="translate(1200, 400) scale(0.45)" fill="#1e3a6e">
    <!-- Üst kısım - başlık -->
    <rect x="-180" y="-280" width="360" height="25" rx="3"/>
    <rect x="-160" y="-250" width="320" height="20" rx="2"/>

    <!-- Scroll (kıvrım) sol -->
    <circle cx="-150" cy="-210" r="25" fill="none" stroke="#1e3a6e" stroke-width="12"/>
    <rect x="-150" y="-235" width="30" height="50" fill="#1e3a6e"/>

    <!-- Scroll (kıvrım) sağ -->
    <circle cx="150" cy="-210" r="25" fill="none" stroke="#1e3a6e" stroke-width="12"/>
    <rect x="120" y="-235" width="30" height="50" fill="#1e3a6e"/>

    <!-- Ana gövde - üst bar -->
    <rect x="-130" y="-220" width="260" height="30" rx="2"/>

    <!-- Sütunlar -->
    <rect x="-110" y="-185" width="35" height="320" fill="#1e3a6e"/>
    <rect x="-45" y="-185" width="35" height="280" fill="#1e3a6e"/>
    <rect x="15" y="-185" width="35" height="280" fill="#1e3a6e"/>
    <rect x="75" y="-185" width="35" height="320" fill="#1e3a6e"/>

    <!-- Alt sivri uçlar -->
    <polygon points="-110,135 -75,135 -92,200"/>
    <polygon points="-45,95 -10,95 -27,160"/>
    <polygon points="15,95 50,95 32,160"/>
    <polygon points="75,135 110,135 92,200"/>
  </g>

  <!-- Üst ve alt çizgi vurgusu -->
  <rect x="100" y="95" width="2200" height="5" fill="#1e3a6e" opacity="0.8"/>
  <rect x="100" y="700" width="2200" height="5" fill="#1e3a6e" opacity="0.8"/>

</svg>