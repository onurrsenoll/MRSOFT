<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" width="2400" height="800">
  <title>MR Cam Kaplama Tasarımı V2 - Çizgili MR Harfleri</title>

  <defs>
    <!-- Çapraz çizgi deseni -->
    <pattern id="fineStripes" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(-50)">
      <rect width="8" height="16" fill="#1e3a6e"/>
      <rect x="8" width="8" height="16" fill="transparent"/>
    </pattern>

    <!-- Clip path for left section -->
    <clipPath id="leftClip">
      <rect x="0" y="50" width="900" height="700"/>
    </clipPath>

    <!-- Clip path for right section -->
    <clipPath id="rightClip">
      <rect x="1500" y="50" width="900" height="700"/>
    </clipPath>
  </defs>

  <!-- Sol taraf - M harfi çapraz çizgilerle -->
  <g clip-path="url(#leftClip)">
    <path d="M 100 650 L 100 150 L 300 400 L 500 150 L 500 650 L 400 650 L 400 350 L 300 500 L 200 350 L 200 650 Z"
          fill="url(#fineStripes)"/>
  </g>

  <!-- Merkez Logo - Beyaz arka plan -->
  <circle cx="1200" cy="400" r="230" fill="white" opacity="0.98"/>
  <circle cx="1200" cy="400" r="235" fill="none" stroke="#1e3a6e" stroke-width="6"/>

  <!-- MR Logo - İyonik Sütun (Merkez) -->
  <g transform="translate(1200, 400)" fill="#1e3a6e">

    <!-- Üst başlık (abakus) -->
    <rect x="-85" y="-155" width="170" height="12" rx="2"/>

    <!-- Üst kısım altı -->
    <rect x="-75" y="-143" width="150" height="8"/>

    <!-- Sol volüt (kıvrım) -->
    <g transform="translate(-65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-4" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Sağ volüt (kıvrım) -->
    <g transform="translate(65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-16" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Volütler arası bağlantı -->
    <rect x="-50" y="-130" width="100" height="15" rx="3"/>

    <!-- Echinus -->
    <ellipse cx="0" cy="-100" rx="55" ry="8"/>

    <!-- Sütun gövdesi -->
    <rect x="-50" y="-92" width="100" height="200" fill="#1e3a6e"/>

    <!-- Yiv çizgileri -->
    <rect x="-40" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-25" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-10" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="6" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="21" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="36" y="-92" width="4" height="200" fill="white" opacity="0.3"/>

    <!-- Alt kaide -->
    <rect x="-55" y="108" width="110" height="10"/>
    <rect x="-60" y="118" width="120" height="8"/>

    <!-- Alt sivri uçlar -->
    <polygon points="-50,126 -35,126 -42,160"/>
    <polygon points="-20,126 -5,126 -12,155"/>
    <polygon points="5,126 20,126 12,155"/>
    <polygon points="35,126 50,126 42,160"/>

  </g>

  <!-- Sağ taraf - R harfi çapraz çizgilerle -->
  <g clip-path="url(#rightClip)">
    <path d="M 1600 650 L 1600 150 L 1900 150 Q 2050 150 2050 300 Q 2050 420 1900 450 L 2100 650 L 1950 650 L 1780 470 L 1750 470 L 1750 650 Z M 1750 380 L 1880 380 Q 1930 380 1930 300 Q 1930 220 1880 220 L 1750 220 Z"
          fill="url(#fineStripes)" fill-rule="evenodd"/>
  </g>

  <!-- Dekoratif çizgiler -->
  <line x1="50" y1="100" x2="2350" y2="100" stroke="#1e3a6e" stroke-width="4" opacity="0.7"/>
  <line x1="50" y1="700" x2="2350" y2="700" stroke="#1e3a6e" stroke-width="4" opacity="0.7"/>

</svg>