<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <title>MR Cam Kaplama - Minimal Tasarım</title>

  <defs>
    <!-- İnce çapraz çizgi deseni -->
    <pattern id="thinStripes" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(-45)">
      <rect width="6" height="12" fill="#1e3a6e"/>
      <rect x="6" width="6" height="12" fill="transparent"/>
    </pattern>
  </defs>

  <!-- Sol çizgili bölüm -->
  <rect x="0" y="75" width="400" height="450" fill="url(#thinStripes)" opacity="0.85"/>

  <!-- Merkez logo alanı -->
  <rect x="420" y="75" width="360" height="450" fill="white" opacity="0.95"/>
  <rect x="420" y="75" width="360" height="450" fill="none" stroke="#1e3a6e" stroke-width="3"/>

  <!-- MR Logo - İyonik Sütun (Merkez) -->
  <g transform="translate(600, 300) scale(0.85)" fill="#1e3a6e">

    <!-- Üst başlık (abakus) -->
    <rect x="-85" y="-155" width="170" height="12" rx="2"/>

    <!-- Üst kısım altı -->
    <rect x="-75" y="-143" width="150" height="8"/>

    <!-- Sol volüt (kıvrım) -->
    <g transform="translate(-65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-4" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Sağ volüt (kıvrım) -->
    <g transform="translate(65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-16" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Volütler arası bağlantı -->
    <rect x="-50" y="-130" width="100" height="15" rx="3"/>

    <!-- Echinus -->
    <ellipse cx="0" cy="-100" rx="55" ry="8"/>

    <!-- Sütun gövdesi -->
    <rect x="-50" y="-92" width="100" height="200" fill="#1e3a6e"/>

    <!-- Yiv çizgileri -->
    <rect x="-40" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-25" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-10" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="6" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="21" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="36" y="-92" width="4" height="200" fill="white" opacity="0.3"/>

    <!-- Alt kaide -->
    <rect x="-55" y="108" width="110" height="10"/>
    <rect x="-60" y="118" width="120" height="8"/>

    <!-- Alt sivri uçlar -->
    <polygon points="-50,126 -35,126 -42,160"/>
    <polygon points="-20,126 -5,126 -12,155"/>
    <polygon points="5,126 20,126 12,155"/>
    <polygon points="35,126 50,126 42,160"/>

  </g>

  <!-- Sağ çizgili bölüm -->
  <rect x="800" y="75" width="400" height="450" fill="url(#thinStripes)" opacity="0.85"/>

  <!-- Üst ve alt çizgi -->
  <rect x="0" y="70" width="1200" height="5" fill="#1e3a6e"/>
  <rect x="0" y="525" width="1200" height="5" fill="#1e3a6e"/>

</svg>