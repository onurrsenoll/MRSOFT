<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <title>MR Cam Kaplama - Tek Panel Tasarımı (Ofis Bölmesi)</title>

  <defs>
    <!-- Çapraz çizgi deseni -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(-50)">
      <rect width="9" height="18" fill="#1e3a6e"/>
      <rect x="9" width="9" height="18" fill="transparent"/>
    </pattern>

    <!-- Logo için maske - logo alanını şeffaf bırak -->
    <mask id="logoAreaMask">
      <rect width="100%" height="100%" fill="white"/>
      <ellipse cx="500" cy="600" rx="200" ry="200" fill="black"/>
    </mask>
  </defs>

  <!-- Çapraz çizgili arka plan - logo alanı hariç -->
  <rect x="50" y="100" width="900" height="1000" fill="url(#stripes)" mask="url(#logoAreaMask)" opacity="0.9"/>

  <!-- Logo merkezi - beyaz arka plan -->
  <ellipse cx="500" cy="600" rx="195" ry="195" fill="white" opacity="0.95"/>
  <ellipse cx="500" cy="600" rx="200" ry="200" fill="none" stroke="#1e3a6e" stroke-width="5"/>

  <!-- MR Sütun Logo -->
  <g transform="translate(500, 600) scale(0.42)" fill="#1e3a6e">
    <!-- Üst başlık -->
    <rect x="-180" y="-280" width="360" height="25" rx="3"/>
    <rect x="-160" y="-250" width="320" height="20" rx="2"/>

    <!-- Scroll sol -->
    <circle cx="-150" cy="-210" r="25" fill="none" stroke="#1e3a6e" stroke-width="12"/>
    <rect x="-150" y="-235" width="30" height="50"/>

    <!-- Scroll sağ -->
    <circle cx="150" cy="-210" r="25" fill="none" stroke="#1e3a6e" stroke-width="12"/>
    <rect x="120" y="-235" width="30" height="50"/>

    <!-- Üst bar -->
    <rect x="-130" y="-220" width="260" height="30" rx="2"/>

    <!-- Sütunlar -->
    <rect x="-110" y="-185" width="35" height="320"/>
    <rect x="-45" y="-185" width="35" height="280"/>
    <rect x="15" y="-185" width="35" height="280"/>
    <rect x="75" y="-185" width="35" height="320"/>

    <!-- Sivri uçlar -->
    <polygon points="-110,135 -75,135 -92,200"/>
    <polygon points="-45,95 -10,95 -27,160"/>
    <polygon points="15,95 50,95 32,160"/>
    <polygon points="75,135 110,135 92,200"/>
  </g>

  <!-- Üst ve alt border -->
  <rect x="50" y="95" width="900" height="5" fill="#1e3a6e"/>
  <rect x="50" y="1100" width="900" height="5" fill="#1e3a6e"/>

</svg>