<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <title>MR Cam Kaplama - Tek Panel Tasarımı (Ofis Bölmesi)</title>

  <defs>
    <!-- Çapraz çizgi deseni -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(-50)">
      <rect width="9" height="18" fill="#1e3a6e"/>
      <rect x="9" width="9" height="18" fill="transparent"/>
    </pattern>

    <!-- Logo için maske -->
    <mask id="logoAreaMask">
      <rect width="100%" height="100%" fill="white"/>
      <ellipse cx="500" cy="600" rx="200" ry="200" fill="black"/>
    </mask>
  </defs>

  <!-- Çapraz çizgili arka plan - logo alanı hariç -->
  <rect x="50" y="100" width="900" height="1000" fill="url(#stripes)" mask="url(#logoAreaMask)" opacity="0.9"/>

  <!-- Logo merkezi - beyaz arka plan -->
  <ellipse cx="500" cy="600" rx="195" ry="195" fill="white" opacity="0.98"/>
  <ellipse cx="500" cy="600" rx="200" ry="200" fill="none" stroke="#1e3a6e" stroke-width="5"/>

  <!-- MR Logo - İyonik Sütun -->
  <g transform="translate(500, 600) scale(1.1)" fill="#1e3a6e">

    <!-- Üst başlık (abakus) -->
    <rect x="-85" y="-155" width="170" height="12" rx="2"/>

    <!-- Üst kısım altı -->
    <rect x="-75" y="-143" width="150" height="8"/>

    <!-- Sol volüt (kıvrım) -->
    <g transform="translate(-65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-4" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Sağ volüt (kıvrım) -->
    <g transform="translate(65, -120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#1e3a6e" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#1e3a6e"/>
      <rect x="-16" y="-25" width="20" height="25" fill="#1e3a6e"/>
    </g>

    <!-- Volütler arası bağlantı -->
    <rect x="-50" y="-130" width="100" height="15" rx="3"/>

    <!-- Echinus (volüt altı yastık) -->
    <ellipse cx="0" cy="-100" rx="55" ry="8"/>

    <!-- Sütun gövdesi -->
    <rect x="-50" y="-92" width="100" height="200" fill="#1e3a6e"/>

    <!-- Yiv çizgileri (fluting) -->
    <rect x="-40" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-25" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="-10" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="6" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="21" y="-92" width="4" height="200" fill="white" opacity="0.3"/>
    <rect x="36" y="-92" width="4" height="200" fill="white" opacity="0.3"/>

    <!-- Alt kaide -->
    <rect x="-55" y="108" width="110" height="10"/>
    <rect x="-60" y="118" width="120" height="8"/>

    <!-- Alt sivri uçlar -->
    <polygon points="-50,126 -35,126 -42,160"/>
    <polygon points="-20,126 -5,126 -12,155"/>
    <polygon points="5,126 20,126 12,155"/>
    <polygon points="35,126 50,126 42,160"/>

  </g>

  <!-- Üst ve alt border -->
  <rect x="50" y="95" width="900" height="5" fill="#1e3a6e"/>
  <rect x="50" y="1100" width="900" height="5" fill="#1e3a6e"/>

</svg>